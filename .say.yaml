say:
  generate:
    rulemap:
      types:
        cmds:
          - do: "deno run --no-config --allow-read --allow-write=portable-types.ts refresh-portable-types.ts"
  test:
    # The shorthand replaces the builtin's command; the rule below sorts ahead of
    # it on priority, because the builtin carries stop:true and a rule sorted
    # after it is emitted and never runs.
    do: "deno run --allow-read=. bounds.ts"
    rulemap:
      loop:
        priority: -1
        cmds:
          - do: "deno run --allow-read=. check-loop.ts --self-test"
          - do: "deno test --config deno.json --allow-read workflow_test.ts"
      # emit.cue's output pinned against a small program; testdata/ is outside
      # every `./...` pattern, so no app or scan evaluates it.
      emit:
        priority: -1
        cmds:
          - do: "cue vet -c ./testdata/emit"
          - do: "deno test --no-config --allow-read --allow-run=cue read.test.ts table-order.test.ts ssr.test.ts builder-inputs.test.ts release-gcp.test.ts release-docker.test.ts"
      distribution:
        priority: -1
        cmds:
          - do: "deno test --config deno.json --allow-read --allow-write --allow-run --allow-env bootstrap_test.ts installed_test.ts layout_test.ts derive-input.test.ts project-config.test.ts write_test.ts terminal-corpus_test.ts"
      types:
        priority: -1
        cmds:
          - do: "deno test --config deno.json --allow-read --allow-write --allow-run types_test.ts"
      # Held seed rows: their rendering into 900_seed.sql and their judgement,
      # which shells out to cue in a scratch package.
      seed:
        priority: -1
        cmds:
          - do: "deno test --config deno.json --allow-read --allow-write --allow-run=cue seed_test.ts"
      identity:
        priority: -1
        cmds:
          - do: "deno test --config deno.json --allow-read --allow-run=cue identity_test.ts"
          - do: "deno test --no-config --allow-read --allow-run=cue auth-providers.test.ts login-design.test.ts"
      k8s:
        priority: -1
        cmds:
          - do: "nu k8s/release_test.nu"
      gcp:
        priority: -1
        cmds:
          - do: "nu gcp/release_test.nu"
      # The identity broker and identity.#Signin (docs/identity.md). The front
      # runs against a real Hydra, which mise fetches here and no consumer's
      # toolchain carries.
      signin:
        priority: -1
        cmds:
          - do: "cue vet -c=false ./identity"
          - do: "deno test --no-config --allow-read --allow-run=cue identity-signin.test.ts"
          - do: "deno test --no-config --allow-net --allow-env --allow-read identity/oidc_test.ts identity/broker identity/hydra/fake_test.ts"
          - do: "mise x github:ory/hydra@26.2.0 -- sh -c 'HYDRA_BIN=$(command -v hydra) deno test --no-config --allow-net --allow-env --allow-read --allow-run identity/hydra/front_test.ts'"
      type-system:
        priority: -1
        cmds:
          - do: "deno test --no-config --allow-read --allow-run=cue type-proto.test.ts type-sql.test.ts portable-types.test.ts types.test.ts"
          # The client's transformations against the table that defines them,
          # and the table against CUE's own reading of it. Both need `cue`, and
          # the agreement test needs a scratch directory to run it in.
          - do: "deno test --no-config --allow-read --allow-write --allow-run=cue type-agreement.test.ts"
          - do: "mise exec -- deno test --no-config --allow-read --allow-write --allow-run=protoc,cue type-proto.roundtrip.test.ts"
      # The schema-evolution passes. Named here because this rulemap names test
      # files one by one: a suite that exists and is not listed is a suite that
      # runs only when someone globs locally, which is indistinguishable from
      # passing. replay drives duckdb over replay.sql, and withheld drives
      # check-proto as a subprocess, so both need run and a scratch directory.
      schema-evolution:
        priority: -1
        cmds:
          - do: "mise exec -- deno test --no-config --allow-read --allow-write --allow-run --allow-env replay.test.ts withheld.test.ts proto-baseline.test.ts check-inputs_test.ts"
      machines:
        priority: -1
        cmds:
          - do: "mise exec -- deno test --config deno.json --allow-read --allow-run=cue mecha-machine.test.ts lifecycle-machine.test.ts vendored-unit.test.ts kinetic-child.test.ts browser-security.test.ts objects_test.ts"
          - do: 'mise exec -- deno test --config deno.json --allow-read --allow-run=cue --filter "server timers refuse" machine-timers.integration.test.ts'
          - do: "mise exec -- deno test --config deno.json --allow-read --allow-write --allow-run=cue ir-render_test.ts ir-md_test.ts ir-machine.test.ts"
      # What each Jessie role may be granted, held against both cages and the schema.
      endowments:
        priority: -1
        cmds:
          - do: "mise exec -- deno test --config deno.json --allow-read --allow-env --allow-run=cue endowments_test.ts"
          - do: "mise exec -- deno test --config deno.json --allow-read --allow-write --allow-env derive_effects_test.ts"
          # An engine's module graph: linked here by Endo's ModuleSource,
          # imported by the terminal's cage, every way out refused at the link.
          - do: "mise exec -- deno test --config deno.json --allow-read --allow-write --allow-env engine-link.test.ts"
      duckstream:
        priority: -1
        cmds:
          - do: "mise exec -- deno test --config deno.json --allow-read --allow-run --allow-env duckstream.test.ts"
      # A pages release's derived rows: their SQL, and a bundled page whose
      # PGlite boots holding them; bundling needs the omnishell and mecha trees.
      bundle:
        priority: -1
        cmds:
          - do: "mise exec -- deno test --config bundle/deno.json --allow-read --allow-write --allow-run --allow-env bundle/bundle_test.ts bundle/edge-addresses_test.ts bundle/edge-ssr_test.ts bundle/edge-machines_test.ts mecha-reducer.test.ts"
      # The door's language rule against the terminal's, over an emitted
      # Caddyfile: two runtimes that cannot share code and must not disagree.
      negotiation:
        priority: -1
        cmds:
          - do: "deno test --config deno.json --allow-read negotiation_test.ts"
      links:
        priority: -1
        cmds:
          - do: "deno test --no-config --allow-read links_test.ts"
      favicon:
        priority: -1
        cmds:
          - do: "deno test --config deno.json --allow-read --allow-write --allow-run --allow-env favicon_test.ts"
      envelope:
        priority: -1
        cmds:
          - do: "deno test --config deno.json --allow-read --allow-write --allow-run --allow-env envelope_test.ts"
  # lint is not a #verb: it carries its own rulemap with no builtin wiring, so a
  # `do:` here type-checks, exports, and never reaches lint.rules.
  lint:
    # The bootstrap reference states the tool releases distribution pins, each
    # where it names one.
    shared:
      - pattern: '(?:#Version: +"|Pronto \*\*)(?<v>\d+\.\d+\.\d+)'
        files: [distribution/config.cue, skills/pronto-turn/references/bootstrap.md]
      - pattern: '(?:#SaytVersion: +"|Sayt \*\*|bonisoft3/sayt/v)(?<v>\d+\.\d+\.\d+)'
        files: [distribution/config.cue, skills/pronto-turn/references/bootstrap.md]
    rulemap:
      types:
        cmds:
          - do: "deno check --config deno.json *.ts"
