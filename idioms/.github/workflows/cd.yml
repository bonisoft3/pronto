# generated by pronto from program.cue — do not edit
# Release the app to its declared hosting targets.
#
# GitHub reads workflows only from a repository's root .github/, so this
# file is inert in the monorepo and active in the mirror, where copybara
# moves it to the root. The trigger is the plain `v*` tag the monorepo's
# cd.yml creates here once the mirror holds the tagged commit; nothing
# publishes from a branch, and a dispatch redeploys what main holds.
#
# Pages bundles use the repository's path prefix and a 404 document
# for deep links. Cloudflare publishes its Worker and verifies the
# deployed origin.

name: cd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The released sayt at the version the toolchain pins, its mise cached.
      - uses: bonisoft3/sayt/.github/actions/sayt/install@v0.45.1
        with:
          version: v0.45.1
      - run: sayt setup
        working-directory: .
      - run: sayt release@pages --snapshot --base="/${GITHUB_REPOSITORY##*/}"
        working-directory: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/browser
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: sayt verify@pages --target="${{ steps.deploy.outputs.page_url }}"
        working-directory: .