[settings]
locked = true
lockfile = true
experimental = true
# Global verification toggles must be set alongside the backend-scoped
# ones; the backend settings don't override the globals.
github_attestations = false
slsa = false
github.slsa = false
github.github_attestations = false
aqua.github_attestations = false
aqua.cosign = false
aqua.slsa = false
aqua.minisign = false

[tools]
"github:go-task/task" = "v3.54.0"
"github:nushell/nushell" = "0.116.1"
# The repo-wide CUE pin; exports must be byte-identical everywhere.
"github:cue-lang/cue" = "0.16.1"

# Compares every proto the app does not withhold against its own git history
# (plugins/pronto/check-proto.ts). Ships windows-x64 and windows-arm64.
"github:bufbuild/buf" = "1.74.0"
# Draws an entity's machines into ir.html (plugins/pronto/ir-render.ts): one binary from
# its GitHub release, ELK layout, no browser.
"github:terrastruct/d2" = "v0.9.0"
# Runs write.ts and the pronto/omnishell checkers.
"github:denoland/deno" = "v2.9.7"
# Lint + config validator for the emitted pipeline files.
"github:redpanda-data/connect" = "4.114.0"
# The cluster's own lint check validates docker/Caddyfile.
"github:caddyserver/caddy" = "2.11.7"
# Issues the locally-trusted cert the https door serves (cluster setup check).
"github:FiloSottile/mkcert" = "v1.4.4"

# Evaluates the fact-store invariants at lint (plugins/pronto/check-facts.ts).
# http:, not github:, and the URL is spelled out per platform: the release ships
# libduckdb-* — a header and a shared object — beside the CLI, and the github
# backend picks the library on linux and windows while picking the CLI on macos,
# so the rule would pass on a laptop and report 'duckdb: command not found' in CI.
[tools."http:duckdb"]
version = "1.5.6"
url = 'https://github.com/duckdb/duckdb/releases/download/v{{ version }}/duckdb_cli-{{ os(macos="osx") }}-{{ arch(x64="amd64") }}.zip'

# Spelled out per platform because the template cannot say musl: duckdb ships a
# separate build and an alpine image would otherwise fetch the glibc zip.
# `mise lock` only ever records the platform it runs on, so mise.lock's entries
# for this tool are written by hand, as kubectl's and skaffold's are.
[tools."http:duckdb".platforms]
linux-x64 = { url = 'https://github.com/duckdb/duckdb/releases/download/v{{ version }}/duckdb_cli-linux-amd64.zip' }
linux-arm64 = { url = 'https://github.com/duckdb/duckdb/releases/download/v{{ version }}/duckdb_cli-linux-arm64.zip' }
linux-x64-musl = { url = 'https://github.com/duckdb/duckdb/releases/download/v{{ version }}/duckdb_cli-linux-amd64-musl.zip' }
linux-arm64-musl = { url = 'https://github.com/duckdb/duckdb/releases/download/v{{ version }}/duckdb_cli-linux-arm64-musl.zip' }
macos-arm64 = { url = 'https://github.com/duckdb/duckdb/releases/download/v{{ version }}/duckdb_cli-osx-arm64.zip' }
macos-x64 = { url = 'https://github.com/duckdb/duckdb/releases/download/v{{ version }}/duckdb_cli-osx-amd64.zip' }
windows-x64 = { url = 'https://github.com/duckdb/duckdb/releases/download/v{{ version }}/duckdb_cli-windows-amd64.zip' }

[env]
# `.say.yaml` holds every project to this and says why it differs per checkout.
# The activated branch must not read the variable back: mise renders before it
# drops its previous injection, so `get_env` there carries the last directory's
# name across a cd. Unactivated, there is no hook and nothing stale to read.
# The exec's child runs without MISE_SHELL: a tool stub with a cold cache
# resolves this `[env]` itself, and with the variable set would exec again.
COMPOSE_PROJECT_NAME = '''{% if get_env(name='MISE_SHELL', default='') != '' %}{% if os() == 'windows' %}{{ exec(command='(set MISE_SHELL=) && mise tool-stub ../../plugins/sayt/nu.toml ../../plugins/sayt/compose.nu compose-project') }}{% else %}{{ exec(command='MISE_SHELL= mise tool-stub ../../plugins/sayt/nu.toml ../../plugins/sayt/compose.nu compose-project') }}{% endif %}{% else %}{{ get_env(name='COMPOSE_PROJECT_NAME', default='') }}{% endif %}'''
