[settings]
github_attestations = false
locked = true
lockfile = true
slsa = false

[settings.aqua]
cosign = false
github_attestations = false
minisign = false
slsa = false

[settings.github]
github_attestations = false
slsa = false

[tool_alias]
postgres-3e889cd904bd = 'github:theseus-rs/postgresql-binaries'

[tools]
'github:ConduitIO/conduit' = 'v0.20.4'
'github:F1bonacc1/process-compose' = 'v1.122.0'
'github:axllent/mailpit' = 'v1.32.0'
'github:conduitio-labs/conduit-connector-http' = 'v0.4.0'
'github:dapr/dapr' = 'v1.16.1'
'github:rclone/rclone' = 'v1.71.0'

[tools.'github:PostgREST/postgrest']
postinstall = "nu -c \"'' | decode base64 | decode utf-8 | save -f .postinstall-postgrest.nu; ^nu .postinstall-postgrest.nu; rm -f .postinstall-postgrest.nu\""
version = 'v16.5'

[tools.'github:xataio/pgroll']
bin = 'pgroll'
version = 'v0.16.3'

[tools.'http:hydra']
version = '26.2.0'

[tools.'http:hydra'.platforms]
[tools.'http:hydra'.platforms.linux-arm64]
url = 'https://github.com/ory/hydra/releases/download/v{{ version }}/hydra_{{ version }}-linux_sqlite_arm64.tar.gz'

[tools.'http:hydra'.platforms.linux-arm64-musl]
url = 'https://github.com/ory/hydra/releases/download/v{{ version }}/hydra_{{ version }}-linux_sqlite_arm64.tar.gz'

[tools.'http:hydra'.platforms.linux-x64]
url = 'https://github.com/ory/hydra/releases/download/v{{ version }}/hydra_{{ version }}-linux_sqlite_64bit.tar.gz'

[tools.'http:hydra'.platforms.linux-x64-musl]
url = 'https://github.com/ory/hydra/releases/download/v{{ version }}/hydra_{{ version }}-linux_sqlite_64bit.tar.gz'

[tools.'http:hydra'.platforms.macos-arm64]
url = 'https://github.com/ory/hydra/releases/download/v{{ version }}/hydra_{{ version }}-macOS_sqlite_arm64.tar.gz'

[tools.'http:hydra'.platforms.macos-x64]
url = 'https://github.com/ory/hydra/releases/download/v{{ version }}/hydra_{{ version }}-macOS_sqlite_64bit.tar.gz'

[tools.'http:hydra'.platforms.windows-x64]
url = 'https://github.com/ory/hydra/releases/download/v{{ version }}/hydra_{{ version }}-windows_sqlite_64bit.zip'

[tools.'http:redis']
postinstall = "nu -c \"'' | decode base64 | decode utf-8 | save -f .postinstall-redis.nu; ^nu .postinstall-redis.nu; rm -f .postinstall-redis.nu\""
version = '8.6.2'

[tools.'http:redis'.platforms]
[tools.'http:redis'.platforms.linux-arm64]
url = 'https://github.com/redis/redis/archive/refs/tags/{{ version }}.tar.gz'

[tools.'http:redis'.platforms.linux-arm64-musl]
url = 'https://github.com/redis/redis/archive/refs/tags/{{ version }}.tar.gz'

[tools.'http:redis'.platforms.linux-x64]
url = 'https://github.com/redis/redis/archive/refs/tags/{{ version }}.tar.gz'

[tools.'http:redis'.platforms.linux-x64-musl]
url = 'https://github.com/redis/redis/archive/refs/tags/{{ version }}.tar.gz'

[tools.'http:redis'.platforms.macos-arm64]
url = 'https://github.com/redis/redis/archive/refs/tags/{{ version }}.tar.gz'

[tools.'http:redis'.platforms.macos-x64]
url = 'https://github.com/redis/redis/archive/refs/tags/{{ version }}.tar.gz'

[tools.'http:redis'.platforms.windows-x64]
url = 'https://github.com/redis-windows/redis-windows/releases/download/8.6.7/Redis-8.6.7-Windows-x64-msys2.zip'

[tools.postgres-3e889cd904bd]
postinstall = "nu -c \"'' | decode base64 | decode utf-8 | save -f .postinstall-postgres.nu; ^nu .postinstall-postgres.nu; rm -f .postinstall-postgres.nu\""
version = '18.6.1'
