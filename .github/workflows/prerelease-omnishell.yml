# Publishes a forks' prerelease of omnishell (bsoneca/pronto forks/README.md) from
# Actions, as prerelease-mecha.yml does mecha's: the CUE module to
# ghcr.io/bsoneca/cue-modules and the runtime tarballs as a release here, tagged
# omnishell-v<version>. A module already published is kept, so a run that failed
# later runs again. An app routing omnishell to ghcr finds the upstream releases
# pronto requires there too.
#
# Push a branch named `publish-omnishell/v<version>`, such as
# publish-omnishell/v0.20.3-phone.1: the version is the branch's, and the commit is
# .github/prerelease-omnishell.env's OMNISHELL_REF.
name: prerelease-omnishell
on:
  push:
    branches: ['publish-omnishell/v*']
permissions:
  contents: write
  packages: write
env:
  REG: ghcr.io/bsoneca/cue-modules/github.com/bonisoft3/omnishell
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: versions
        run: |
          echo "OMNISHELL_V=${GITHUB_REF_NAME#publish-omnishell/v}" >> "$GITHUB_ENV"
          grep -E '^OMNISHELL_REF=[0-9a-f]{40}$' .github/prerelease-omnishell.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: bsoneca/omnishell-fork
          ref: ${{ env.OMNISHELL_REF }}
          path: omnishell
          fetch-depth: 1
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.16.1
      # GHCR_TOKEN, a token with write:packages, when the package doesn't
      # grant this repository's Actions write.
      - name: crane
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin crane
          echo "$GH_TOKEN" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: published already
        id: published
        run: |
          if crane digest "$REG:v$OMNISHELL_V" >/dev/null 2>&1; then echo "$REG:v$OMNISHELL_V is published: the module is kept"; echo "module=true" >> "$GITHUB_OUTPUT"; fi
      - name: snapshot
        run: |
          mkdir "$RUNNER_TEMP/omnishell"
          git -C omnishell archive HEAD | tar x -C "$RUNNER_TEMP/omnishell"
          cd "$RUNNER_TEMP/omnishell"
          # The runtime mise installs as github:bonisoft3/omnishell is this
          # prerelease too, so the module's toolchain names its own version.
          python3 -I - "$OMNISHELL_V" <<'PY'
          import re, sys
          v = sys.argv[1]
          p = 'toolchain/tools.cue'
          s = open(p).read()
          t = re.sub(r'("github:bonisoft3/omnishell":\s+)"[^"]+"', lambda m: m.group(1) + f'"{v}"', s, count=1)
          assert t != s, p
          open(p, 'w').write(t)
          PY
          grep -n '"github:bonisoft3/omnishell"' toolchain/tools.cue
          grep -n 'module:' cue.mod/module.cue
      # ghcr takes no single upload over 4MiB and `cue mod publish` sends a
      # module in one: publish to a local registry and let crane copy it up.
      - name: module
        if: steps.published.outputs.module != 'true'
        run: |
          crane registry serve --address localhost:5051 >/dev/null 2>&1 &
          sleep 2
          cd "$RUNNER_TEMP/omnishell"
          git init -q && git add -A && git -c user.email=fork@local -c user.name=fork commit -qm "omnishell v$OMNISHELL_V"
          CUE_REGISTRY='github.com/bonisoft3/omnishell=localhost:5051+insecure,registry.cue.works' cue mod publish "v$OMNISHELL_V"
          crane copy --insecure "localhost:5051/github.com/bonisoft3/omnishell:v$OMNISHELL_V" "$REG:v$OMNISHELL_V"
      # An app routes every version of omnishell to ghcr, so the upstream
      # releases pronto and mecha require are there too.
      - name: base
        run: |
          for v in v0.19.1 v0.20.2 v0.20.3; do
            crane digest "$REG:$v" >/dev/null 2>&1 || crane copy "registry.cue.works/github.com/bonisoft3/omnishell:$v" "$REG:$v"
          done
      - name: runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist
          for triple in linux-x64 linux-arm64 linux-armv7 macos-x64 macos-arm64 windows-x64 windows-arm64; do
            tar czf "dist/omnishell-$triple.tar.gz" -C "$RUNNER_TEMP/omnishell" --exclude=.git --exclude=.github --exclude=node_modules .
          done
          gh release create "omnishell-v$OMNISHELL_V" dist/*.tar.gz --target "$GITHUB_SHA" --prerelease --title "omnishell v$OMNISHELL_V (fork prerelease)" --notes "omnishell's runtime of the forks' prerelease, from bsoneca/omnishell-fork@$OMNISHELL_REF: see bsoneca/pronto forks/README.md."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/omnishell-v$OMNISHELL_V" --jq '.assets[]|"\(.name) \(.id) \(.digest)"' | tee -a "$GITHUB_STEP_SUMMARY"
