services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: source
    command: [
      postgres,
      -c,
      wal_level=logical,
      -c,
      max_replication_slots=4,
      -c,
      max_wal_senders=4,
    ]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d source"]
      interval: 1s
      timeout: 3s
      retries: 30
