say:
  build:
    do: "deno run -A prepare.ts"
  lint:
    rulemap:
      spike:
        priority: -1
        stop: true
        cmds:
          - do: "deno lint prepare.ts verify.ts run.ts worker.js"
  test:
    do: "deno check prepare.ts verify.ts run.ts"
  integrate:
    do: "mise exec -- deno run -A run.ts"
