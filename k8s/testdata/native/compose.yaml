services:
  compute:
    image: native-compute:test
    environment:
      DATABASE_URL: postgres://postgres:dev-password@database/native
      SERVICE_JWT: dev-token
      DUCKSTREAM_ENGINE: risingwave
      RISINGWAVE_URL: http://risingwave:4566
      COMPUTATIONS: '[{"name":"metrics","risingwave":"/app/metrics.json"}]'
  risingwave:
    image: native-risingwave:test
  conduit:
    image: native-conduit:test
    environment:
      DATABASE_URL: postgres://postgres:dev-password@database/native
      CONDUIT_DB_TYPE: inmemory
  redis:
    image: native-redis:test
  mesh-events:
    image: native-mesh-events:test
    environment:
      REDIS_HOST: redis:6379
  transform:
    image: native-transform:test
    environment:
      SERVICE_JWT: dev-token
      REDIS_URL: redis://redis:6379
